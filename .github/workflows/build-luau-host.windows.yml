name: Build Luau Host - Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 host
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@d06b37b47cfd043ec794ffa3e40e0b6b5858a7ec # v1.14.2
        with:
          cmake-version: 3.29.5

      - name: Provision pinned MSVC 14.42 compatibility toolset
        shell: pwsh
        run: |
          $reviewedComponent = "Microsoft.VisualStudio.Component.VC.14.42.17.12.x86.x64"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installationPath = & $vswhere `
            -latest `
            -products Microsoft.VisualStudio.Product.Enterprise `
            -version "[17.0,18.0)" `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($installationPath) -or
              -not (Test-Path -LiteralPath $installationPath -PathType Container)) {
            throw "The existing Visual Studio 2022 Enterprise installation was not found."
          }
          $installer = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "The Visual Studio Installer was not found: $installer"
          }
          $arguments = @(
            "modify",
            "--installPath",
            "`"$installationPath`"",
            "--add",
            $reviewedComponent,
            "--quiet",
            "--norestart"
          )
          $installerProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "Visual Studio Installer failed to add $reviewedComponent with exit code $($installerProcess.ExitCode)."
          }
          "LUAU_HOST_VS_INSTALLATION_PATH=$installationPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify pinned MSVC toolchain
        shell: pwsh
        run: |
          $reviewedToolsVersion = "14.42.34433"
          $reviewedCompilerVersion = [Version]"19.42.34444.0"
          $reviewedLinkerVersion = [Version]"14.42.34444.0"
          $reviewedSdkVersion = "10.0.22621.0"
          $installationPath = $env:LUAU_HOST_VS_INSTALLATION_PATH
          if ([string]::IsNullOrWhiteSpace($installationPath) -or
              -not (Test-Path -LiteralPath $installationPath -PathType Container)) {
            throw "The provisioned Visual Studio installation path was not propagated."
          }
          $compiler = Join-Path $installationPath `
            "VC/Tools/MSVC/$reviewedToolsVersion/bin/Hostx64/x64/cl.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Reviewed MSVC toolset $reviewedToolsVersion is not installed: $compiler"
          }
          $linker = Join-Path $installationPath `
            "VC/Tools/MSVC/$reviewedToolsVersion/bin/Hostx64/x64/link.exe"
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "Reviewed MSVC linker is not installed: $linker"
          }
          $actualCompilerVersion = [Version]([Diagnostics.FileVersionInfo]::GetVersionInfo($compiler).FileVersion)
          if ($actualCompilerVersion -ne $reviewedCompilerVersion) {
            throw "MSVC compiler version mismatch. Expected $reviewedCompilerVersion, found $actualCompilerVersion."
          }
          $actualLinkerVersion = [Version]([Diagnostics.FileVersionInfo]::GetVersionInfo($linker).FileVersion)
          if ($actualLinkerVersion -ne $reviewedLinkerVersion) {
            throw "MSVC linker version mismatch. Expected $reviewedLinkerVersion, found $actualLinkerVersion."
          }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10"
          foreach ($requiredSdkInput in @(
            "Include/$reviewedSdkVersion/um/Windows.h",
            "Include/$reviewedSdkVersion/ucrt/corecrt.h",
            "Lib/$reviewedSdkVersion/um/x64/kernel32.lib"
          )) {
            $requiredSdkPath = Join-Path $sdkRoot $requiredSdkInput
            if (-not (Test-Path -LiteralPath $requiredSdkPath -PathType Leaf)) {
              throw "Reviewed Windows SDK $reviewedSdkVersion is incomplete: $requiredSdkPath"
            }
          }
          Write-Host (
            "Verified MSVC compiler $actualCompilerVersion and linker $actualLinkerVersion " +
            "from toolset $reviewedToolsVersion " +
            "and Windows SDK $reviewedSdkVersion.")

      - name: Configure host
        working-directory: native/luau-host
        shell: pwsh
        run: >-
          cmake --preset windows-x64
          "-DCMAKE_GENERATOR_INSTANCE=$env:LUAU_HOST_VS_INSTALLATION_PATH"

      - name: Build and audit host
        working-directory: native/luau-host
        run: cmake --build --preset windows-x64

      - name: Run native conformance tests
        working-directory: native/luau-host
        run: ctest --preset windows-x64

      - name: Install host
        working-directory: native/luau-host
        run: cmake --install out/build/windows-x64 --config Release

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.306

      - name: Restore .NET test harness
        run: dotnet restore Luau.slnx

      - name: Run .NET suite against host
        shell: pwsh
        run: |
          $nativeHost = Join-Path $env:GITHUB_WORKSPACE "native/luau-host/out/install/windows-x64/luau_host.dll"
          dotnet test Luau.slnx --no-restore --configuration Release "-p:LuauHostNativePath=$nativeHost"

      - name: Run host lifetime and fault soak
        shell: pwsh
        run: |
          $nativeHost = Join-Path $env:GITHUB_WORKSPACE "native/luau-host/out/install/windows-x64/luau_host.dll"
          & ./tools/Test-LuauHostSoak.ps1 `
            -Configuration Release `
            -SoakIterations 25 `
            -NativeHostPath $nativeHost

      - name: Reject malformed host ABI fixtures before native operations
        run: >-
          dotnet run
          --project tests/Luau.Host.AbiFixtureHost/Luau.Host.AbiFixtureHost.csproj
          --no-restore
          --configuration Release
          --
          --fixtures native/luau-host/out/build/windows-x64/invalid-abi-fixtures

      - name: Write validated artifact and ABI manifest
        shell: pwsh
        run: |
          & ./native/luau-host/cmake/Write-ArtifactManifest.ps1 `
            -BinaryPath native/luau-host/out/install/windows-x64/luau_host.dll `
            -Platform win-x64 `
            -Configuration Release `
            -OutputPath native/luau-host/out/install/windows-x64/luau_host.manifest.json

      - name: Require current shipped Windows plugin
        shell: pwsh
        run: >-
          powershell -ExecutionPolicy Bypass
          -File tools/Copy-NativeArtifactsToUnity.ps1
          -Platform win-x64
          -Check

      - name: Shape shipping host and external symbols
        shell: pwsh
        run: >-
          powershell -ExecutionPolicy Bypass
          -File tools/Copy-NativeArtifactsToUnity.ps1
          -Platform win-x64

      - name: Upload unstripped host, audited shipping output, and symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luau-host-win-x64-release
          if-no-files-found: error
          path: |
            native/luau-host/out/install/windows-x64/luau_host.dll
            native/luau-host/out/install/windows-x64/luau_host.manifest.json
            native/luau-host/out/install/windows-x64/share/luau-host/luau_host.exports
            native/luau-host/out/shipping/win-x64/
            native/luau-host/out/symbols/win-x64/
