name: Build Luau Host - Windows

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      refresh-artifacts:
        description: Build replacement shipping artifacts for a source change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 host
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 3.29.5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Provision and verify pinned MSVC toolchain
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- windows-toolchain --provision --github-env "%GITHUB_ENV%"

      - name: Configure host
        working-directory: native/luau-host
        run: cmake --preset windows-x64 "-DCMAKE_GENERATOR_INSTANCE=%LUAU_HOST_VS_INSTALLATION_PATH%"

      - name: Build and audit host
        working-directory: native/luau-host
        run: cmake --build --preset windows-x64

      - name: Run native conformance tests
        working-directory: native/luau-host
        run: ctest --preset windows-x64

      - name: Install host
        working-directory: native/luau-host
        run: cmake --install out/build/windows-x64 --config Release

      - name: Restore .NET test harness
        run: dotnet restore Luau.slnx

      - name: Run .NET suite against host
        run: dotnet test Luau.slnx --no-restore --configuration Release "-p:LuauHostNativePath=%GITHUB_WORKSPACE%\native\luau-host\out\install\windows-x64\luau_host.dll"

      - name: Run host lifetime and fault soak
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- host-soak --configuration Release --iterations 25 --native-host "%GITHUB_WORKSPACE%\native\luau-host\out\install\windows-x64\luau_host.dll"

      - name: Reject malformed host ABI fixtures before native operations
        run: >-
          dotnet run
          --project tests/Luau.Host.AbiFixtureHost/Luau.Host.AbiFixtureHost.csproj
          --no-restore
          --configuration Release
          --
          --fixtures native/luau-host/out/build/windows-x64/invalid-abi-fixtures

      - name: Write validated artifact and ABI manifest
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- artifact-manifest --binary native/luau-host/out/install/windows-x64/luau_host.dll --platform win-x64 --configuration Release --output native/luau-host/out/install/windows-x64/luau_host.manifest.json

      - name: Require current shipped Windows plugin
        if: ${{ !inputs.refresh-artifacts }}
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- native-artifacts --platform win-x64 --check

      - name: Shape shipping host and external symbols
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- native-artifacts --platform win-x64

      - name: Upload unstripped host, audited shipping output, and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luau-host-win-x64-release
          if-no-files-found: error
          path: |
            native/luau-host/out/install/windows-x64/luau_host.dll
            native/luau-host/out/install/windows-x64/luau_host.manifest.json
            native/luau-host/out/install/windows-x64/share/luau-host/luau_host.exports
            native/luau-host/out/shipping/win-x64/
            native/luau-host/out/symbols/win-x64/
