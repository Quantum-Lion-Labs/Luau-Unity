name: Build Luau Host - Linux

on:
  workflow_call:
    inputs:
      refresh-artifacts:
        description: Build replacement shipping artifacts for a source change
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      refresh-artifacts:
        description: Build replacement shipping artifacts for a source change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build linux-x64 host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Ubuntu 22.04 sets the shipping glibc floor (2.35), so the plugin loads on
    # that release and every newer distribution. The image is pinned by digest,
    # and native-artifacts requires the exact toolchain package versions listed
    # in tools/UnityPackageReleasePolicy.json, so CI rebuilds the committed
    # plugin byte for byte or explains which Ubuntu package moved.
    container:
      image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    env:
      LUAU_HOST_CI_CONTAINER_IMAGE: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      DEBIAN_FRONTEND: noninteractive
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Install Ubuntu 22.04 toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git libicu70 ninja-build \
            clang-15 lld-15 llvm-15 libc6-dev libgcc-12-dev libstdc++-12-dev
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 3.29.5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Verify pinned compiler toolchain
        run: |
          test "$(clang-15 -dumpversion)" = "15.0.7"
          test "$(cmake --version | head -n 1)" = "cmake version 3.29.5"
          ldd --version | head -n 1
          dpkg-query -W clang-15 lld-15 llvm-15 libc6-dev libgcc-12-dev libstdc++-12-dev

      - name: Configure host
        working-directory: native/luau-host
        run: cmake --preset linux-x64-shipping

      - name: Build and audit host
        working-directory: native/luau-host
        run: cmake --build --preset linux-x64-shipping --parallel

      - name: Run native conformance tests
        working-directory: native/luau-host
        run: ctest --preset linux-x64-shipping

      - name: Install host
        working-directory: native/luau-host
        run: cmake --install out/build/linux-x64-shipping

      - name: Write validated artifact and ABI manifest
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- artifact-manifest --binary native/luau-host/out/install/linux-x64-shipping/libluau_host.so --platform linux-x64 --preset linux-x64-shipping --configuration Release --output native/luau-host/out/install/linux-x64-shipping/luau_host.manifest.json

      - name: Require current shipped Linux plugin
        if: ${{ !inputs.refresh-artifacts }}
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- native-artifacts --platform linux-x64 --check

      - name: Shape stripped shipping host and external symbols
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- native-artifacts --platform linux-x64

      - name: Run .NET suite against the stripped shipping host
        run: LUAU_HOST_REFERENCE_WRAP_FIXTURE="$GITHUB_WORKSPACE/native/luau-host/out/build/linux-x64-shipping/reference-wrap-fixture/libluau_host_reference_wrap.so" dotnet test tests/Luau.Tests/Luau.Tests.csproj --configuration Release "-p:LuauHostNativePath=$GITHUB_WORKSPACE/native/luau-host/out/shipping/linux-x64/libluau_host.so"

      - name: Run host lifetime and fault soak against the shipping host
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- host-soak --configuration Release --iterations 25 --native-host "$GITHUB_WORKSPACE/native/luau-host/out/shipping/linux-x64/libluau_host.so"

      - name: Upload unstripped host, audited shipping output, and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luau-host-linux-x64-release
          if-no-files-found: error
          path: |
            native/luau-host/out/install/linux-x64-shipping/libluau_host.so
            native/luau-host/out/install/linux-x64-shipping/luau_host.manifest.json
            native/luau-host/out/install/linux-x64-shipping/share/luau-host/luau_host.exports
            native/luau-host/out/shipping/linux-x64/
            native/luau-host/out/symbols/linux-x64/
