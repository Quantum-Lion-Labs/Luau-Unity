name: Validate Managed Unity Package

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test managed source and shipped artifacts
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Restore managed solution
        run: dotnet restore Luau.slnx

      - name: Run managed tests
        run: dotnet test Luau.slnx --no-restore --configuration Release

      - name: Run bounded artifact parser fuzz smoke
        run: >-
          dotnet run
          --project fuzz/Luau.ArtifactFuzz/Luau.ArtifactFuzz.csproj
          --no-restore
          --configuration Release
          --
          --smoke
          --iterations 25000
          --seed 0x6a09e667f3bcc909

      - name: Retain artifact parser reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luau-artifact-fuzz-reproducers
          if-no-files-found: ignore
          retention-days: 30
          path: artifacts/artifact-fuzz-reproducers/

      - name: Prove managed harness native selection
        shell: pwsh
        run: >-
          powershell -ExecutionPolicy Bypass
          -File tools/Test-ManagedHarnessSelection.ps1

      - name: Require current Unity managed artifacts
        shell: pwsh
        run: >-
          powershell -ExecutionPolicy Bypass
          -File tools/Copy-DotNetArtifactsToUnity.ps1
          -Configuration Release
          -Check

      - name: Validate Unity package static boundaries
        shell: pwsh
        run: >-
          powershell -ExecutionPolicy Bypass
          -File tools/Test-UnityPackageStatic.ps1

      - name: Validate deterministic release package
        shell: pwsh
        run: >-
          powershell -ExecutionPolicy Bypass
          -File tools/Test-UnityPackageRelease.ps1
