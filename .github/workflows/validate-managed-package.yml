name: Validate Managed Unity Package

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test managed source and shipped artifacts
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Restore managed solution
        run: dotnet restore Luau.slnx

      - name: Run managed tests
        run: dotnet test Luau.slnx --no-restore --configuration Release

      - name: Run bounded artifact parser fuzz smoke
        run: >-
          dotnet run
          --project fuzz/Luau.ArtifactFuzz/Luau.ArtifactFuzz.csproj
          --no-restore
          --configuration Release
          --
          --smoke
          --iterations 25000
          --seed 0x6a09e667f3bcc909

      - name: Retain artifact parser reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luau-artifact-fuzz-reproducers
          if-no-files-found: ignore
          retention-days: 30
          path: artifacts/artifact-fuzz-reproducers/

      - name: Prove managed harness native selection
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- managed-harness-selection

      - name: Require current Unity managed artifacts
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- managed-artifacts --configuration Release --check

      - name: Validate Unity package static boundaries
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- package-static

      - name: Validate deterministic release package
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- package-release
