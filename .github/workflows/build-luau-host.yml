name: Build Luau Host

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/build-luau-host*.yml"
      - ".gitmodules"
      - "native/luau"
      - "native/luau/**"
      - "native/luau-host/**"
      - "Luau.Unity/Runtime/Interop/**"
      - "Luau.Unity/Runtime/Plugins/**"
      - "src/Luau/Internal/LuauNativeProtection.cs"
      - "tests/Luau.Host.AbiFixtureHost/**"
      - "tests/Luau.Tests/NativeAbiHandshakeTests.cs"
      - "tools/harness/**"
      - "tools/Copy-NativeArtifactsToUnity.ps1"
      - "tools/Test-LuauHostSoak.ps1"
      - "tools/Test-ManagedHarnessSelection.ps1"
      - "tools/Test-UnityPackageRelease.ps1"
      - "tools/Test-UnityPackageStatic.ps1"
      - "tools/UnityPackageReleasePolicy.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-luau-host*.yml"
      - ".gitmodules"
      - "native/luau"
      - "native/luau/**"
      - "native/luau-host/**"
      - "Luau.Unity/Runtime/Interop/**"
      - "Luau.Unity/Runtime/Plugins/**"
      - "src/Luau/Internal/LuauNativeProtection.cs"
      - "tests/Luau.Host.AbiFixtureHost/**"
      - "tests/Luau.Tests/NativeAbiHandshakeTests.cs"
      - "tools/harness/**"
      - "tools/Copy-NativeArtifactsToUnity.ps1"
      - "tools/Test-LuauHostSoak.ps1"
      - "tools/Test-ManagedHarnessSelection.ps1"
      - "tools/Test-UnityPackageRelease.ps1"
      - "tools/Test-UnityPackageStatic.ps1"
      - "tools/UnityPackageReleasePolicy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    uses: ./.github/workflows/build-luau-host.windows.yml

  build-android:
    uses: ./.github/workflows/build-luau-host.android.yml

  sanitize-and-fuzz:
    name: Linux ASan, UBSan, and bounded fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 3.29.5

      - name: Verify pinned compiler toolchain
        run: |
          test "$(clang-18 -dumpversion)" = "18.1.3"
          test "$(ninja --version)" = "1.13.2"
          test "$(cmake --version | head -n 1)" = "cmake version 3.29.5"

      - name: Configure sanitizer and fuzz targets
        working-directory: native/luau-host
        run: cmake --preset linux-sanitize

      - name: Build sanitizer and fuzz targets
        working-directory: native/luau-host
        run: cmake --build --preset linux-sanitize --parallel

      - name: Run sanitizer conformance
        working-directory: native/luau-host
        run: ctest --preset linux-sanitize

      - name: Run bounded hostile-input corpora
        working-directory: native/luau-host
        run: cmake --build out/build/linux-sanitize --target luau_host_fuzz_smoke

      - name: Retain minimized reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luau-host-fuzz-reproducers
          if-no-files-found: ignore
          retention-days: 30
          path: native/luau-host/out/build/linux-sanitize/fuzz-artifacts/

  validate-release-package:
    name: Validate exact package release contents
    needs: [build-windows, build-android, sanitize-and-fuzz]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate deterministic release package
        shell: pwsh
        run: >-
          ./tools/Test-UnityPackageRelease.ps1
          -OutputPath native/luau-host/out/release/com.qll.luau.unity-0.2.0.tgz

      - name: Upload deterministic package and file manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luau-unity-upm-release-candidate
          if-no-files-found: error
          path: |
            native/luau-host/out/release/com.qll.luau.unity-0.2.0.tgz
            native/luau-host/out/release/com.qll.luau.unity-0.2.0.tgz.manifest.json
