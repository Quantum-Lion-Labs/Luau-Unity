name: Release Luau.Unity

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-release-source:
    name: Require canonical main commit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Require canonical repository and tagged commit on main
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- release-source --repository "${{ github.repository }}"

  validate-managed:
    name: Validate managed package
    needs: require-release-source
    uses: ./.github/workflows/validate-managed-package.yml

  validate-native:
    name: Validate native hosts
    needs: require-release-source
    uses: ./.github/workflows/build-luau-host.yml

  publish:
    name: Validate tag and publish GitHub release
    needs: [validate-managed, validate-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Require tag to match package version
        id: package
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- release-metadata --tag "${{ github.ref_name }}" --github-output "$GITHUB_OUTPUT"

      - name: Validate exact tag and build deterministic package
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- package-release --tag "${{ github.ref_name }}" --skip-unity-consumer --output "native/luau-host/out/release/${{ steps.package.outputs.archive_name }}"

      - name: Retain published package inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luau-unity-upm-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            native/luau-host/out/release/${{ steps.package.outputs.archive_name }}
            native/luau-host/out/release/${{ steps.package.outputs.archive_name }}.manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: |
          archive_path="native/luau-host/out/release/$ARCHIVE_NAME"
          gh release create "$RELEASE_TAG" \
            "$archive_path" \
            "$archive_path.manifest.json" \
            --verify-tag \
            --title "Luau.Unity $PACKAGE_VERSION" \
            --generate-notes
