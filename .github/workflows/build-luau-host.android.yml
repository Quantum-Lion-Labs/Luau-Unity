name: Build Luau Host - Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} host
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-arm64
            preset: android-arm64
          - platform: android-x64
            preset: android-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 3.29.5

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install approved Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c

      - name: Configure host
        working-directory: native/luau-host
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build and audit host
        working-directory: native/luau-host
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Install host
        working-directory: native/luau-host
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cmake --install out/build/${{ matrix.preset }}

      - name: Write validated artifact and ABI manifest
        shell: pwsh
        run: |
          & ./native/luau-host/cmake/Write-ArtifactManifest.ps1 `
            -BinaryPath native/luau-host/out/install/${{ matrix.preset }}/libluau_host.so `
            -Platform ${{ matrix.platform }} `
            -Configuration Release `
            -AndroidApi 26 `
            -AndroidNdk 27.2.12479018 `
            -OutputPath native/luau-host/out/install/${{ matrix.preset }}/luau_host.manifest.json

      - name: Require current shipped Android plugin
        shell: pwsh
        run: >-
          & ./tools/Copy-NativeArtifactsToUnity.ps1
          -Platform ${{ matrix.platform }}
          -Check

      - name: Shape stripped shipping host and external symbols
        shell: pwsh
        run: >-
          & ./tools/Copy-NativeArtifactsToUnity.ps1
          -Platform ${{ matrix.platform }}

      - name: Upload unstripped host, audited shipping output, and symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luau-host-${{ matrix.platform }}-release
          if-no-files-found: error
          path: |
            native/luau-host/out/install/${{ matrix.preset }}/libluau_host.so
            native/luau-host/out/install/${{ matrix.preset }}/luau_host.manifest.json
            native/luau-host/out/install/${{ matrix.preset }}/share/luau-host/luau_host.exports
            native/luau-host/out/shipping/${{ matrix.platform }}/
            native/luau-host/out/symbols/${{ matrix.platform }}/
