name: Build Luau Host - Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} host
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-arm64
            preset: android-arm64
          - platform: android-x64
            preset: android-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 3.29.5

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Install approved Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c

      - name: Configure host
        working-directory: native/luau-host
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build and audit host
        working-directory: native/luau-host
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Install host
        working-directory: native/luau-host
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cmake --install out/build/${{ matrix.preset }}

      - name: Write validated artifact and ABI manifest
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- artifact-manifest --binary native/luau-host/out/install/${{ matrix.preset }}/libluau_host.so --platform ${{ matrix.platform }} --configuration Release --android-api 26 --android-ndk 27.2.12479018 --output native/luau-host/out/install/${{ matrix.preset }}/luau_host.manifest.json

      - name: Require current shipped Android plugin
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- native-artifacts --platform ${{ matrix.platform }} --check

      - name: Shape stripped shipping host and external symbols
        run: dotnet run --project tools/Luau.Tooling --configuration Release -- native-artifacts --platform ${{ matrix.platform }}

      - name: Upload unstripped host, audited shipping output, and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luau-host-${{ matrix.platform }}-release
          if-no-files-found: error
          path: |
            native/luau-host/out/install/${{ matrix.preset }}/libluau_host.so
            native/luau-host/out/install/${{ matrix.preset }}/luau_host.manifest.json
            native/luau-host/out/install/${{ matrix.preset }}/share/luau-host/luau_host.exports
            native/luau-host/out/shipping/${{ matrix.platform }}/
            native/luau-host/out/symbols/${{ matrix.platform }}/
